# Production overrides for docker-compose
version: '3.8'

services:
  api:
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/rct-api
        awslogs-region: eu-west-1
        awslogs-stream-prefix: ecs
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  worker:
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/rct-worker
        awslogs-region: eu-west-1
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  nginx:
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/rct-nginx
        awslogs-region: eu-west-1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/rct-engine:/etc/nginx/ssl:ro
