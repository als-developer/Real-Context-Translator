name: Security Scan

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8 AM
  workflow_dispatch:

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Scan Python dependencies
        uses: pypa/gh-action-pip-audit@v1
        with:
          inputs: backend/requirements.txt

      - name: Scan Node.js dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd frontend/web
          npm audit --json > npm-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: frontend/web/npm-audit.json

      - name: Scan Go dependencies
        uses: anchore/scan-action@v3
        with:
          path: backend/go_exporter/
          fail-build: false

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -f infrastructure/docker/Dockerfile.api -t rct-api:test .
          docker build -f infrastructure/docker/Dockerfile.worker -t rct-worker:test .
          docker build -f infrastructure/docker/Dockerfile.go -t rct-exporter:test .

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rct-api:test
          format: 'sarif'
          output: 'trivy-api.sarif'

      - name: Scan Worker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rct-worker:test
          format: 'sarif'
          output: 'trivy-worker.sarif'

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-*.sarif

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  compliance-check:
    name: Compliance Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          ! grep -r "sk_live_" --include="*.py" --include="*.js" --include="*.go" --include="*.yaml" backend/ || exit 1
          ! grep -r "password" --include="*.py" --include="*.js" --include="*.go" backend/ | grep -v "test\|example" || exit 1

      - name: Check encryption requirements
        run: |
          # Verify GPG is used for backups
          grep -q "gpg --encrypt" security/gpg/encrypt_backup.sh || exit 1
          # Verify TLS is configured
          grep -q "ssl_certificate" infrastructure/docker/nginx/nginx.conf || exit 1

  report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [dependency-scan, container-scan, secret-scan, compliance-check]
    
    steps:
      - name: Send security report to Slack
        uses: slackapi/slack-github-action@v1.25
        with:
          payload: |
            {
              "text": "Weekly Security Scan Complete",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*RCT-Engine Weekly Security Report*\n\nDependency Scan: ✅\nContainer Scan: ✅\nSecret Detection: ✅\nCompliance Check: ✅"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK }}
