# LDAP Configuration for Enterprise Authentication
version: "3.8"

services:
  ldap:
    image: osixia/openldap:latest
    container_name: rct-ldap
    environment:
      LDAP_ORGANISATION: "RCT-Engine"
      LDAP_DOMAIN: "rct-engine.com"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD}"
      LDAP_CONFIG_PASSWORD: "${LDAP_CONFIG_PASSWORD}"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "readonly"
      LDAP_READONLY_USER_PASSWORD: "${LDAP_READONLY_PASSWORD}"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./ldifs:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "389:389"
      - "636:636"
    networks:
      - rct-network

  ldap-admin:
    image: osixia/phpldapadmin:latest
    container_name: rct-ldap-admin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "ldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8080:80"
    depends_on:
      - ldap
    networks:
      - rct-network

volumes:
  ldap_data:
  ldap_config:

networks:
  rct-network:
    external: true
