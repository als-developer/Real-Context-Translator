apiVersion: v1
kind: ConfigMap
metadata:
  name: rct-config
  namespace: rct-engine
data:
  environment: "production"
  log_level: "INFO"
  rate_limit_per_second: "50"
  rate_limit_burst: "100"
  stripe_webhook_secret: "whsec_placeholder"
  slack_webhook_url: "https://hooks.slack.com/services/placeholder"
  prometheus_enabled: "true"
  sentry_dsn: "https://placeholder@sentry.io/123"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: rct-engine
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        limit_req_zone $binary_remote_addr zone=rct_limit:10m rate=50r/s;
        
        server {
            listen 80;
            location / {
                limit_req zone=rct_limit burst=100 nodelay;
                proxy_pass http://rct-api:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Request-ID $request_id;
            }
        }
    }
