apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rct-ingress
  namespace: rct-engine
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "50r/s"
    nginx.ingress.kubernetes.io/rate-limit-burst: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1s"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  tls:
  - hosts:
    - api.rct-engine.com
    - dashboard.rct-engine.com
    secretName: rct-tls-secret
  rules:
  - host: api.rct-engine.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rct-api
            port:
              number: 8000
  - host: dashboard.rct-engine.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rct-dashboard
            port:
              number: 3000
