<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCT-Engine - Maintenance Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0F172A;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F1F5F9;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #3B82F6, #06B6D4);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }
        .logo svg {
            width: 48px;
            height: 48px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .status {
            display: inline-block;
            padding: 0.25rem 1rem;
            background: #F59E0B;
            color: #0F172A;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        p {
            color: #94A3B8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(59,130,246,0.2);
            border-top-color: #3B82F6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .social {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .social a {
            color: #64748B;
            text-decoration: none;
            font-size: 0.875rem;
        }
        .social a:hover {
            color: #3B82F6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
        </div>
        <div class="status">MAINTENANCE MODE</div>
        <h1>We'll Be Back Soon</h1>
        <p>RCT-Engine is currently undergoing scheduled maintenance to serve you better. We apologize for any inconvenience.</p>
        <div class="spinner"></div>
        <div class="social">
            <a href="https://status.rct-engine.com">Status Page</a>
            <a href="https://twitter.com/rctengine">Twitter</a>
            <a href="mailto:support@rct-engine.com">Contact Support</a>
        </div>
    </div>
</body>
</html>
