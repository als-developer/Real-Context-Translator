<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RCT-Engine Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0F172A;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            padding: 24px;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #3B82F6, #06B6D4);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px -5px rgba(59,130,246,0.3);
        }
        .icon svg {
            width: 44px;
            height: 44px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #60A5FA, #22D3EE);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .subtitle {
            color: #94A3B8;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .loader {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(59,130,246,0.2);
            border-top-color: #3B82F6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .message {
            font-size: 12px;
            color: #64748B;
        }
        .error {
            color: #EF4444;
            margin-top: 16px;
            font-size: 12px;
        }
        .retry-btn {
            margin-top: 20px;
            background: #1E293B;
            border: 1px solid #334155;
            padding: 8px 24px;
            border-radius: 30px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
        </div>
        <h1>RCT-Engine</h1>
        <p class="subtitle">Real Context Translator</p>
        <div id="status">
            <div class="loader"></div>
            <p class="message">Initializing secure connection...</p>
        </div>
        <div id="error" style="display: none;">
            <p class="error">⚠️ Connection failed. Please check your internet connection.</p>
            <button class="retry-btn" onclick="location.reload()">Retry</button>
        </div>
    </div>
    <script>
        // Check connectivity to API
        const API_URL = 'https://api.rct-engine.com/health';
        
        fetch(API_URL, { timeout: 5000 })
            .then(response => {
                if (response.ok) {
                    document.getElementById('status').innerHTML = `
                        <div style="color: #10B981;">✓ Connected</div>
                        <p class="message">Redirecting to app...</p>
                    `;
                    setTimeout(() => {
                        window.location.href = 'rct://app';
                    }, 1000);
                } else {
                    throw new Error('API unavailable');
                }
            })
            .catch(() => {
                document.getElementById('status').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            });
    </script>
</body>
</html>
